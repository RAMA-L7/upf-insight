<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#2980b9"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; }
      .section-title { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .domain-aon { fill: #f5f5f0; stroke: #1a1a1a; stroke-width: 1.5; rx: 6; }
      .domain-core { fill: #f8f8f8; stroke: #1a1a1a; stroke-width: 1.5; rx: 6; }
      .iso-box { fill: #fff3e0; stroke: #e67e22; stroke-width: 1.5; rx: 4; }
      .iso-correct { fill: #e8f5e9; stroke: #27ae60; stroke-width: 1.5; rx: 4; }
      .iso-wrong { fill: #ffebee; stroke: #c0392b; stroke-width: 1.5; rx: 4; }
      .element-box { fill: #fff; stroke: #555; stroke-width: 1; rx: 3; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-lg { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .label-volt { font-size: 11px; font-weight: 600; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .connector { fill: none; stroke: #1a1a1a; stroke-width: 1.5; marker-end: url(#arr); }
      .connector-blue { fill: none; stroke: #2980b9; stroke-width: 1.5; marker-end: url(#arr-blue); }
      .iso-line { fill: none; stroke: #e67e22; stroke-width: 2; }
      .iso-line-ok { fill: none; stroke: #27ae60; stroke-width: 2; }
      .iso-line-err { fill: none; stroke: #c0392b; stroke-width: 2; }
      .annotation { font-size: 9px; fill: #999; font-family: ui-monospace, monospace; }
      .ctrl-label { font-size: 9px; fill: #e67e22; text-anchor: middle; }
      .divider { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .badge-ok { fill: #e8f5e9; stroke: #27ae60; stroke-width: 1; rx: 10; }
      .badge-err { fill: #ffebee; stroke: #c0392b; stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="28" class="title" text-anchor="middle">Isolation Placement — Parent Side</text>
  <text x="410" y="46" class="subtitle" text-anchor="middle">UPF-041: isolation belongs on the always-on / parent side of a switchable domain boundary</text>

  <!-- ═══════ CORRECT: Isolation on parent (AON) side ═══════ -->
  <text x="200" y="78" class="section-title" text-anchor="middle">✓ Correct — Isolation on Parent</text>

  <!-- AON domain (parent) -->
  <rect x="40" y="88" width="320" height="280" class="domain-aon"/>
  <text x="200" y="108" class="label-lg">AON Domain (Parent)</text>
  <rect x="148" y="114" width="104" height="20" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="200" y="128" class="label-volt">1.0V · always-on</text>

  <!-- Isolation box (on AON side) -->
  <rect x="100" y="150" width="200" height="60" class="iso-correct"/>
  <text x="200" y="172" class="label" font-size="11" fill="#27ae60">Isolation</text>
  <text x="200" y="188" class="label-sm" fill="#27ae60">location: parent · clamp: 0</text>
  <text x="200" y="202" class="annotation" text-anchor="middle">set_isolation_strategy -location parent</text>

  <!-- Signal crossing arrow -->
  <line x1="200" y1="210" x2="200" y2="240" class="iso-line-ok" marker-end="url(#arr)"/>
  <text x="220" y="228" class="ctrl-label" fill="#27ae60">signals isolated here</text>

  <!-- Domain boundary -->
  <line x1="40" y1="240" x2="360" y2="240" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="370" y="244" class="annotation">boundary</text>

  <!-- CORE domain (child) -->
  <rect x="100" y="250" width="200" height="110" class="domain-core"/>
  <text x="200" y="272" class="label" font-size="11">CORE Domain (Child)</text>
  <rect x="148" y="278" width="104" height="20" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="200" y="292" class="label-volt">0.8V · switchable</text>

  <!-- CORE elements -->
  <rect x="130" y="306" width="140" height="22" class="element-box"/>
  <text x="200" y="321" class="label-sm">cpu_pipeline</text>
  <rect x="130" y="334" width="140" height="22" class="element-box"/>
  <text x="200" y="349" class="label-sm">data_cache</text>

  <!-- Arrow showing signal direction -->
  <text x="200" y="388" class="label-mono" fill="#27ae60">signals cross at isolation boundary</text>
  <text x="200" y="402" class="label-mono" fill="#27ae60">parent-side isolation protects AON</text>

  <!-- ═══════ WRONG: Isolation on child (CORE) side ═══════ -->
  <text x="620" y="78" class="section-title" text-anchor="middle" fill="#c0392b">✗ Wrong — Isolation on Child</text>

  <!-- AON domain (parent) — no isolation -->
  <rect x="460" y="88" width="320" height="140" class="domain-aon"/>
  <text x="620" y="108" class="label-lg">AON Domain (Parent)</text>
  <rect x="568" y="114" width="104" height="20" rx="10" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="620" y="128" class="label-volt">1.0V · always-on</text>

  <!-- AON elements — unprotected -->
  <rect x="530" y="142" width="180" height="22" class="element-box" stroke="#c0392b"/>
  <text x="620" y="157" class="label-sm" fill="#c0392b">always_on_logic ← UNPROTECTED</text>
  <rect x="530" y="170" width="180" height="22" class="element-box" stroke="#c0392b"/>
  <text x="620" y="185" class="label-sm" fill="#c0392b">io_pads ← UNPROTECTED</text>
  <rect x="530" y="198" width="180" height="22" class="element-box" stroke="#c0392b"/>
  <text x="620" y="213" class="label-sm" fill="#c0392b">reset_ctrl ← UNPROTECTED</text>

  <!-- Domain boundary -->
  <line x1="460" y1="240" x2="780" y2="240" stroke="#c0392b" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="790" y="244" class="annotation" fill="#c0392b">boundary</text>

  <!-- CORE domain (child) — wrong isolation placement -->
  <rect x="520" y="250" width="200" height="180" class="domain-core" stroke="#c0392b" stroke-dasharray="4,2"/>
  <text x="620" y="272" class="label" font-size="11" fill="#c0392b">CORE Domain (Child)</text>
  <rect x="568" y="278" width="104" height="20" rx="10" fill="none" stroke="#c0392b" stroke-width="1"/>
  <text x="620" y="292" class="label-volt" fill="#c0392b">0.8V · switchable</text>

  <!-- Isolation box (wrong — on child side) -->
  <rect x="560" y="308" width="120" height="50" class="iso-wrong"/>
  <text x="620" y="330" class="label" font-size="10" fill="#c0392b">Isolation ✗</text>
  <text x="620" y="346" class="label-sm" fill="#c0392b">location: self</text>

  <!-- CORE elements -->
  <rect x="550" y="368" width="140" height="22" class="element-box"/>
  <text x="620" y="383" class="label-sm">cpu_pipeline</text>

  <!-- Error explanation -->
  <rect x="460" y="440" width="320" height="60" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1"/>
  <text x="620" y="460" class="label" fill="#c0392b" font-size="11">Why this is wrong:</text>
  <text x="620" y="476" class="label-sm" fill="#c0392b">Isolation on child side doesn't protect</text>
  <text x="620" y="490" class="label-sm" fill="#c0392b">parent/AON signals when CORE powers down</text>
</svg>
