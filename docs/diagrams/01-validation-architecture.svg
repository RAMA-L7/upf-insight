<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#666"/>
    </marker>
    <style>
      .title { font-size: 18px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; font-style: italic; }
      .box { fill: #fff; stroke: #1a1a1a; stroke-width: 1.5; rx: 4; }
      .box-accent { fill: #f0f0f0; stroke: #1a1a1a; stroke-width: 1.5; rx: 4; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .connector { fill: none; stroke: #1a1a1a; stroke-width: 1.5; marker-end: url(#arrow); }
      .connector-light { fill: none; stroke: #666; stroke-width: 1; marker-end: url(#arrow-light); stroke-dasharray: 4,3; }
      .group-label { font-size: 9px; fill: #999; text-anchor: middle; text-transform: uppercase; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Title -->
  <text x="400" y="32" class="title" text-anchor="middle">UPF-Insight Validation Architecture</text>
  <text x="400" y="50" class="subtitle" text-anchor="middle">Deterministic · Evidence-backed · Local-first</text>

  <!-- UPF Input -->
  <rect x="330" y="72" width="140" height="40" class="box-accent"/>
  <text x="400" y="97" class="label">UPF 3.0 Files</text>

  <!-- Arrow: UPF → Parser -->
  <line x1="400" y1="112" x2="400" y2="140" class="connector"/>

  <!-- Parser -->
  <rect x="310" y="140" width="180" height="44" class="box"/>
  <text x="400" y="160" class="label">Parser</text>
  <text x="400" y="174" class="label-sm">Tcl/UPF command records</text>

  <!-- Arrow: Parser → Model -->
  <line x1="400" y1="184" x2="400" y2="212" class="connector"/>

  <!-- PowerIntentModel -->
  <rect x="270" y="212" width="260" height="56" class="box-accent"/>
  <text x="400" y="234" class="label" font-size="13">PowerIntentModel</text>
  <text x="400" y="252" class="label-sm">domains · supplies · switches · strategies · PST</text>

  <!-- Branching arrows from model -->
  <line x1="330" y1="268" x2="160" y2="310" class="connector"/>
  <line x1="400" y1="268" x2="400" y2="310" class="connector"/>
  <line x1="470" y1="268" x2="640" y2="310" class="connector"/>

  <!-- Three analysis subgraphs -->
  <!-- Supply Graph -->
  <rect x="80" y="310" width="160" height="44" class="box"/>
  <text x="160" y="330" class="label">Supply Graph</text>
  <text x="160" y="344" class="label-sm">nets · sets · connectivity</text>

  <!-- Voltage Model -->
  <rect x="320" y="310" width="160" height="44" class="box"/>
  <text x="400" y="330" class="label">Voltage Model</text>
  <text x="400" y="344" class="label-sm">domains · levels · crossings</text>

  <!-- Strategy Graph -->
  <rect x="560" y="310" width="160" height="44" class="box"/>
  <text x="640" y="330" class="label">Strategy Graph</text>
  <text x="640" y="344" class="label-sm">ISO · LS · RET · SW</text>

  <!-- Converging arrows to Rule Engine -->
  <line x1="160" y1="354" x2="400" y2="396" class="connector"/>
  <line x1="400" y1="354" x2="400" y2="396" class="connector"/>
  <line x1="640" y1="354" x2="400" y2="396" class="connector"/>

  <!-- Rule Engine -->
  <rect x="290" y="396" width="220" height="44" class="box-accent"/>
  <text x="400" y="416" class="label" font-size="13">Rule Engine</text>
  <text x="400" y="430" class="label-sm">74 deterministic rules · 5 layers</text>

  <!-- Arrow: Rule Engine → Findings -->
  <line x1="400" y1="440" x2="400" y2="468" class="connector"/>

  <!-- Findings -->
  <rect x="310" y="468" width="180" height="40" class="box"/>
  <text x="400" y="493" class="label">Findings</text>

  <!-- Branching arrows from Findings to outputs -->
  <line x1="340" y1="508" x2="150" y2="538" class="connector"/>
  <line x1="400" y1="508" x2="400" y2="538" class="connector"/>
  <line x1="460" y1="508" x2="650" y2="538" class="connector"/>

  <!-- CLI -->
  <rect x="80" y="538" width="140" height="36" class="box"/>
  <text x="150" y="561" class="label">CLI / API</text>

  <!-- Reports -->
  <rect x="330" y="538" width="140" height="36" class="box"/>
  <text x="400" y="561" class="label">Reports</text>

  <!-- Workspace UI -->
  <rect x="580" y="538" width="140" height="36" class="box"/>
  <text x="650" y="561" class="label">Workspace UI</text>

  <!-- Evidence boundary annotation -->
  <rect x="560" y="380" width="195" height="32" rx="3" fill="none" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="657" y="400" class="group-label">support boundary</text>

  <!-- Finding model annotation -->
  <rect x="550" y="460" width="210" height="50" rx="3" fill="none" stroke="#999" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="655" y="476" class="group-label">finding model</text>
  <text x="655" y="488" class="label-mono">rule · severity · support</text>
  <text x="655" y="500" class="label-mono">source · dependency</text>

  <!-- Footer -->
  <text x="400" y="605" class="label-mono" font-size="9">UPF-Insight v0.2.4 · deterministic validation · no LLMs in the analysis path</text>
</svg>
