<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#1a1a1a"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; }
      .section-title { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .state-card { fill: #fafafa; stroke: #1a1a1a; stroke-width: 1.5; rx: 6; }
      .state-valid { fill: #f5faf5; stroke: #27ae60; stroke-width: 1.5; rx: 6; }
      .state-invalid { fill: #fdf5f5; stroke: #c0392b; stroke-width: 1.5; rx: 6; }
      .supply-on { fill: #e8f5e9; stroke: #27ae60; stroke-width: 1; rx: 3; }
      .supply-off { fill: #ffebee; stroke: #c0392b; stroke-width: 1; rx: 3; }
      .supply-impossible { fill: #ffebee; stroke: #c0392b; stroke-width: 2; rx: 3; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-lg { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .state-text { font-size: 11px; font-weight: 600; text-anchor: middle; font-family: ui-monospace, monospace; }
      .connector { fill: none; stroke: #1a1a1a; stroke-width: 1.5; marker-end: url(#arr); }
      .connector-green { fill: none; stroke: #27ae60; stroke-width: 1.5; marker-end: url(#arr); }
      .annotation { font-size: 9px; fill: #999; font-family: ui-monospace, monospace; }
      .divider { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .badge-ok { fill: #e8f5e9; stroke: #27ae60; stroke-width: 1; rx: 10; }
      .badge-err { fill: #ffebee; stroke: #c0392b; stroke-width: 1; rx: 10; }
      .transition-label { font-size: 9px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="28" class="title" text-anchor="middle">Power State Table (PST)</text>
  <text x="410" y="46" class="subtitle" text-anchor="middle">Legal and illegal power states across supply networks</text>

  <!-- ═══════ State cards ═══════ -->
  <!-- ALL_ON -->
  <rect x="30" y="70" width="170" height="180" class="state-valid"/>
  <text x="115" y="92" class="label-lg">ALL_ON</text>

  <rect x="50" y="102" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="117" class="state-text" fill="#27ae60">VDD       ON</text>

  <rect x="50" y="130" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="145" class="state-text" fill="#27ae60">VDD_CORE  ON</text>

  <rect x="50" y="158" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="173" class="state-text" fill="#27ae60">VDD_RET   ON</text>

  <rect x="50" y="186" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="201" class="state-text" fill="#27ae60">CORE      ON</text>

  <rect x="50" y="214" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="115" y="229" class="state-text" fill="#27ae60">AON       ON</text>

  <!-- CORE_OFF -->
  <rect x="220" y="70" width="170" height="180" class="state-valid"/>
  <text x="305" y="92" class="label-lg">CORE_OFF</text>

  <rect x="240" y="102" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="305" y="117" class="state-text" fill="#27ae60">VDD       ON</text>

  <rect x="240" y="130" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="305" y="145" class="state-text" fill="#c0392b">VDD_CORE  OFF</text>

  <rect x="240" y="158" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="305" y="173" class="state-text" fill="#27ae60">VDD_RET   ON</text>

  <rect x="240" y="186" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="305" y="201" class="state-text" fill="#c0392b">CORE      OFF</text>

  <rect x="240" y="214" width="130" height="22" rx="3" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="305" y="229" class="state-text" fill="#27ae60">AON       ON</text>

  <!-- SYSTEM_OFF -->
  <rect x="410" y="70" width="170" height="180" class="state-valid"/>
  <text x="495" y="92" class="label-lg">SYSTEM_OFF</text>

  <rect x="430" y="102" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="117" class="state-text" fill="#c0392b">VDD       OFF</text>

  <rect x="430" y="130" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="145" class="state-text" fill="#c0392b">VDD_CORE  OFF</text>

  <rect x="430" y="158" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="173" class="state-text" fill="#c0392b">VDD_RET   OFF</text>

  <rect x="430" y="186" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="201" class="state-text" fill="#c0392b">CORE      OFF</text>

  <rect x="430" y="214" width="130" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="229" class="state-text" fill="#c0392b">AON       OFF</text>

  <!-- Valid badge -->
  <rect x="50" y="254" width="80" height="20" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="90" y="268" class="state-text" fill="#27ae60" font-size="9">✓ VALID</text>

  <rect x="240" y="254" width="80" height="20" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="280" y="268" class="state-text" fill="#27ae60" font-size="9">✓ VALID</text>

  <rect x="430" y="254" width="80" height="20" rx="10" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="470" y="268" class="state-text" fill="#27ae60" font-size="9">✓ VALID</text>

  <!-- Transition arrows between states -->
  <line x1="200" y1="160" x2="218" y2="160" class="connector-green"/>
  <text x="209" y="152" class="transition-label">power down</text>

  <line x1="390" y1="160" x2="408" y2="160" class="connector-green"/>
  <text x="399" y="152" class="transition-label">power down</text>

  <!-- ═══════ Invalid state ═══════ -->
  <line x1="30" y1="290" x2="790" y2="290" class="divider"/>

  <text x="410" y="316" class="section-title" text-anchor="middle" fill="#c0392b">Invalid State — UPF-039 Violation</text>

  <!-- Invalid state card -->
  <rect x="220" y="330" width="380" height="120" class="state-invalid"/>
  <text x="410" y="354" class="label-lg" fill="#c0392b">IMPOSSIBLE STATE</text>

  <rect x="250" y="366" width="150" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="325" y="381" class="state-text" fill="#c0392b">VDD       OFF</text>

  <rect x="420" y="366" width="150" height="22" rx="3" fill="#ffebee" stroke="#c0392b" stroke-width="2"/>
  <text x="495" y="381" class="state-text" fill="#c0392b">VDD_CORE  ON ←</text>

  <!-- Big X -->
  <text x="410" y="418" font-size="36" fill="#c0392b" font-weight="700">✗</text>

  <!-- Explanation -->
  <text x="410" y="442" class="label" fill="#c0392b" font-size="11">Power cannot appear downstream when</text>
  <text x="410" y="456" class="label" fill="#c0392b" font-size="11">the switch input is OFF</text>

  <!-- ═══════ Supply hierarchy explanation ═══════ -->
  <line x1="30" y1="475" x2="790" y2="475" class="divider"/>

  <text x="410" y="498" class="section-title" text-anchor="middle">Supply Hierarchy Constraint</text>

  <!-- VDD → SW → VDD_CORE chain -->
  <rect x="80" y="510" width="80" height="24" rx="3" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="120" y="527" class="label-sm">VDD</text>

  <line x1="160" y1="522" x2="218" y2="522" class="connector"/>

  <polygon points="240,510 270,522 240,534 210,522" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="526" class="label-sm" font-size="8">SW</text>

  <line x1="270" y1="522" x2="318" y2="522" class="connector"/>

  <rect x="340" y="510" width="100" height="24" rx="3" fill="#e8e8e8" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="390" y="527" class="label-sm">VDD_CORE</text>

  <line x1="440" y1="522" x2="488" y2="522" class="connector"/>

  <rect x="510" y="510" width="80" height="24" rx="3" fill="#fafafa" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="527" class="label-sm">CORE</text>

  <!-- Constraint text -->
  <text x="640" y="520" class="label" fill="#c0392b" font-size="11">If VDD = OFF</text>
  <text x="640" y="536" class="label" fill="#c0392b" font-size="11">→ VDD_CORE must = OFF</text>

  <!-- Rule callout -->
  <rect x="220" y="545" width="380" height="24" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1"/>
  <text x="410" y="561" class="label-mono" fill="#c0392b">UPF-039 · PST state inconsistency · supply hierarchy violation</text>
</svg>
