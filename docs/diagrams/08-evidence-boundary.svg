<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; }
      .section-title { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .known-box { fill: #e8f5e9; stroke: #27ae60; stroke-width: 1.5; rx: 6; }
      .unknown-box { fill: #fff3e0; stroke: #e67e22; stroke-width: 1.5; rx: 6; }
      .out-box { fill: #fafafa; stroke: #ccc; stroke-width: 1; rx: 6; }
      .principle-box { fill: #f5f5f0; stroke: #1a1a1a; stroke-width: 1.5; rx: 6; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-lg { font-size: 14px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .annotation { font-size: 9px; fill: #999; font-family: ui-monospace, monospace; }
      .check { font-size: 14px; fill: #27ae60; text-anchor: middle; }
      .cross { font-size: 14px; fill: #e67e22; text-anchor: middle; }
      .dash { font-size: 14px; fill: #ccc; text-anchor: middle; }
      .principle-text { font-size: 12px; fill: #1a1a1a; text-anchor: middle; font-weight: 600; }
      .principle-sub { font-size: 10px; fill: #666; text-anchor: middle; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="28" class="title" text-anchor="middle">Evidence Boundary</text>
  <text x="410" y="46" class="subtitle" text-anchor="middle">What UPF-Insight proves · what it cannot prove · what it does not attempt</text>

  <!-- ═══════ Three zones ═══════ -->

  <!-- Zone 1: UPF-Only (definitive) -->
  <rect x="30" y="70" width="240" height="260" class="known-box"/>
  <text x="150" y="94" class="label-lg" fill="#27ae60">UPF-Only Analysis</text>
  <text x="150" y="110" class="label-sm" fill="#27ae60">definitive findings</text>

  <text x="50" y="138" class="check">✓</text>
  <text x="140" y="142" class="label-sm" text-anchor="start">Supply topology completeness</text>

  <text x="50" y="162" class="check">✓</text>
  <text x="140" y="166" class="label-sm" text-anchor="start">Domain declaration consistency</text>

  <text x="50" y="186" class="check">✓</text>
  <text x="140" y="190" class="label-sm" text-anchor="start">PST state consistency</text>

  <text x="50" y="210" class="check">✓</text>
  <text x="140" y="214" class="label-sm" text-anchor="start">Isolation/LS strategy presence</text>

  <text x="50" y="234" class="check">✓</text>
  <text x="140" y="238" class="label-sm" text-anchor="start">Voltage-aware LS direction</text>

  <text x="50" y="258" class="check">✓</text>
  <text x="140" y="262" class="label-sm" text-anchor="start">Switch control connectivity</text>

  <text x="50" y="282" class="check">✓</text>
  <text x="140" y="286" class="label-sm" text-anchor="start">Duplicate definition detection</text>

  <text x="50" y="306" class="check">✓</text>
  <text x="140" y="310" class="label-sm" text-anchor="start">Syntax &amp; reference validation</text>

  <!-- Zone 2: Design-Aware (partial) -->
  <rect x="290" y="70" width="240" height="260" class="unknown-box"/>
  <text x="410" y="94" class="label-lg" fill="#e67e22">Design-Aware Analysis</text>
  <text x="410" y="110" class="label-sm" fill="#e67e22">requires netlist context</text>

  <text x="310" y="138" class="cross">◐</text>
  <text x="400" y="142" class="label-sm" text-anchor="start">Instance existence checks</text>

  <text x="310" y="162" class="cross">◐</text>
  <text x="400" y="166" class="label-sm" text-anchor="start">Control-signal existence</text>

  <text x="310" y="186" class="cross">◐</text>
  <text x="400" y="190" class="label-sm" text-anchor="start">Crossing coverage</text>

  <text x="310" y="210" class="cross">◐</text>
  <text x="400" y="214" class="label-sm" text-anchor="start">Retention coverage vs flops</text>

  <text x="310" y="234" class="cross">◐</text>
  <text x="400" y="238" class="label-sm" text-anchor="start">Library PG mapping</text>

  <text x="310" y="258" class="cross">◐</text>
  <text x="400" y="262" class="label-sm" text-anchor="start">Netlist connectivity</text>

  <text x="310" y="282" class="cross">◐</text>
  <text x="400" y="286" class="label-sm" text-anchor="start">Timing-aware validation</text>

  <text x="310" y="306" class="cross">◐</text>
  <text x="400" y="310" class="label-sm" text-anchor="start">Power-network analysis</text>

  <!-- Zone 3: Out of Scope -->
  <rect x="550" y="70" width="240" height="260" class="out-box"/>
  <text x="670" y="94" class="label-lg">Out of Scope</text>
  <text x="670" y="110" class="label-sm">never attempted</text>

  <text x="570" y="138" class="dash">—</text>
  <text x="660" y="142" class="label-sm" text-anchor="start">Power/IR analysis</text>

  <text x="570" y="162" class="dash">—</text>
  <text x="660" y="166" class="label-sm" text-anchor="start">STA timing</text>

  <text x="570" y="186" class="dash">—</text>
  <text x="660" y="190" class="label-sm" text-anchor="start">Formal verification</text>

  <text x="570" y="210" class="dash">—</text>
  <text x="660" y="214" class="label-sm" text-anchor="start">Physical implementation</text>

  <text x="570" y="234" class="dash">—</text>
  <text x="660" y="238" class="label-sm" text-anchor="start">RTL analysis</text>

  <text x="570" y="258" class="dash">—</text>
  <text x="660" y="262" class="label-sm" text-anchor="start">Power-state simulation</text>

  <text x="570" y="282" class="dash">—</text>
  <text x="660" y="286" class="label-sm" text-anchor="start">Electromigration</text>

  <text x="570" y="306" class="dash">—</text>
  <text x="660" y="310" class="label-sm" text-anchor="start">Leakage analysis</text>

  <!-- ═══════ Key principle ═══════ -->
  <line x1="30" y1="350" x2="790" y2="350" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,3"/>

  <rect x="100" y="365" width="620" height="120" class="principle-box"/>
  <text x="410" y="390" class="label-lg">Core Principle</text>

  <!-- Two sides of the principle -->
  <rect x="120" y="402" width="280" height="36" rx="4" fill="#ffebee" stroke="#c0392b" stroke-width="1"/>
  <text x="260" y="424" class="principle-text" fill="#c0392b">"I cannot prove the crossing"</text>

  <text x="410" y="424" class="label-lg" font-size="16">≠</text>

  <rect x="420" y="402" width="280" height="36" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="424" class="principle-text" fill="#27ae60">"The crossing is invalid"</text>

  <text x="410" y="465" class="label" font-size="11">Unknown ≠ False</text>
  <text x="410" y="480" class="label-sm">Absence of evidence is not evidence of absence.</text>
</svg>
