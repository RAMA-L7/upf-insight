<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#e67e22"/>
    </marker>
    <style>
      .title { font-size: 17px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 11px; fill: #666; }
      .section-title { font-size: 13px; font-weight: 700; fill: #1a1a1a; }
      .root-box { fill: #ffebee; stroke: #c0392b; stroke-width: 2; rx: 6; }
      .blocked-box { fill: #fff3e0; stroke: #e67e22; stroke-width: 1.5; rx: 6; }
      .dependent-box { fill: #fafafa; stroke: #888; stroke-width: 1; rx: 6; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .rule-id { font-size: 11px; font-weight: 700; text-anchor: middle; font-family: ui-monospace, monospace; }
      .connector { fill: none; stroke: #1a1a1a; stroke-width: 1.5; marker-end: url(#arr); }
      .connector-red { fill: none; stroke: #c0392b; stroke-width: 1.5; marker-end: url(#arr-red); }
      .connector-orange { fill: none; stroke: #e67e22; stroke-width: 1.5; marker-end: url(#arr-orange); }
      .blocked-label { font-size: 9px; fill: #e67e22; text-anchor: middle; font-style: italic; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="28" class="title" text-anchor="middle">Finding Cascade &amp; Dependencies</text>
  <text x="410" y="46" class="subtitle" text-anchor="middle">Root-cause findings block dependent findings — resolve the root first</text>

  <!-- Main cascade tree -->
  <text x="410" y="78" class="section-title" text-anchor="middle">Example: Undefined Supply Cascade</text>

  <!-- Root: UPF-010 -->
  <rect x="290" y="90" width="240" height="70" class="root-box"/>
  <text x="410" y="112" class="rule-id" fill="#c0392b">UPF-010</text>
  <text x="410" y="128" class="label" font-size="11">Undefined Supply</text>
  <text x="410" y="144" class="label-sm" fill="#c0392b">ROOT CAUSE · BLOCKER</text>

  <!-- Connector lines down — only to rules that depend_on UPF-010 -->
  <line x1="370" y1="160" x2="240" y2="210" class="connector-red"/>
  <line x1="450" y1="160" x2="580" y2="210" class="connector-red"/>

  <!-- Blocked labels on edges -->
  <text x="295" y="182" class="blocked-label">blocked_by ↑</text>
  <text x="530" y="182" class="blocked-label">blocked_by ↑</text>

  <!-- Level 2: UPF-070, UPF-073 (both depend_on UPF-010 in registry) -->
  <rect x="130" y="210" width="220" height="60" class="blocked-box"/>
  <text x="240" y="230" class="rule-id" fill="#e67e22">UPF-070</text>
  <text x="240" y="246" class="label" font-size="10">Switch Supply Undefined</text>
  <text x="240" y="258" class="label-sm" fill="#e67e22">BLOCKED · depends_on UPF-010</text>

  <rect x="470" y="210" width="220" height="60" class="blocked-box"/>
  <text x="580" y="230" class="rule-id" fill="#e67e22">UPF-073</text>
  <text x="580" y="246" class="label" font-size="10">Switch Output Disconnected</text>
  <text x="580" y="258" class="label-sm" fill="#e67e22">BLOCKED · depends_on UPF-010</text>

  <!-- Connector lines from blocked findings down to dependent -->
  <line x1="310" y1="270" x2="310" y2="310" class="connector-orange"/>
  <line x1="510" y1="270" x2="510" y2="310" class="connector-orange"/>

  <text x="310" y="295" class="blocked-label">consequence ↓</text>
  <text x="510" y="295" class="blocked-label">consequence ↓</text>

  <!-- Level 3: dependent findings (consequences, not direct depends_on) -->
  <rect x="190" y="310" width="240" height="60" class="dependent-box"/>
  <text x="310" y="330" class="rule-id" fill="#888">UPF-042</text>
  <text x="310" y="346" class="label" font-size="10">Missing Isolation on Crossing</text>
  <text x="310" y="358" class="label-sm">DEPENDENT · consequence of undefined supply</text>

  <rect x="450" y="310" width="240" height="60" class="dependent-box"/>
  <text x="570" y="330" class="rule-id" fill="#888">UPF-061</text>
  <text x="570" y="346" class="label" font-size="10">Missing Level Shifter</text>
  <text x="570" y="358" class="label-sm">DEPENDENT · consequence of undefined supply</text>

  <!-- Resolution guidance -->
  <line x1="30" y1="390" x2="790" y2="390" stroke="#ddd" stroke-width="0.8" stroke-dasharray="4,3"/>

  <text x="410" y="414" class="section-title" text-anchor="middle">Resolution Order</text>

  <rect x="100" y="425" width="180" height="28" rx="4" fill="#ffebee" stroke="#c0392b" stroke-width="1.5"/>
  <text x="190" y="444" class="label" fill="#c0392b" font-size="11">1. Fix UPF-010 (root)</text>

  <line x1="280" y1="439" x2="320" y2="439" class="connector"/>

  <rect x="320" y="425" width="180" height="28" rx="4" fill="#fff3e0" stroke="#e67e22" stroke-width="1"/>
  <text x="410" y="444" class="label" fill="#e67e22" font-size="11">2. UPF-070/073 resolve</text>

  <line x1="500" y1="439" x2="540" y2="439" class="connector"/>

  <rect x="540" y="425" width="180" height="28" rx="4" fill="#fafafa" stroke="#888" stroke-width="1"/>
  <text x="630" y="444" class="label" fill="#888" font-size="11">3. UPF-042/061 clear</text>

  <text x="410" y="458" class="label-mono">resolve root causes first — dependent findings clear automatically</text>
</svg>
