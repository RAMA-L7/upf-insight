<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .subtitle { font-size: 12px; fill: #666; text-anchor: middle; }
      .big-number { font-size: 64px; font-weight: 800; fill: #1a1a1a; text-anchor: middle; }
      .big-label { font-size: 14px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .stat-number { font-size: 28px; font-weight: 700; fill: #1a1a1a; text-anchor: middle; }
      .stat-label { font-size: 10px; fill: #666; text-anchor: middle; }
      .label { font-size: 12px; font-weight: 600; fill: #1a1a1a; text-anchor: middle; }
      .label-sm { font-size: 10px; fill: #555; text-anchor: middle; }
      .label-mono { font-size: 10px; fill: #888; text-anchor: middle; font-family: ui-monospace, monospace; }
      .annotation { font-size: 9px; fill: #999; font-family: ui-monospace, monospace; }
      .divider { stroke: #ddd; stroke-width: 0.8; stroke-dasharray: 4,3; }
      .bar-fill { fill: #27ae60; rx: 2; }
      .bar-bg { fill: #f0f0f0; rx: 2; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="36" class="title">UPF-Insight</text>
  <text x="410" y="56" class="title" font-size="16">Adversarial Validation</text>
  <text x="410" y="76" class="subtitle">Every intentional defect detected · zero missed · zero false positives</text>

  <!-- Hero numbers -->
  <rect x="80" y="100" width="200" height="120" rx="8" fill="#f5f5f0" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="180" y="175" class="big-number">42</text>
  <text x="180" y="200" class="big-label">Intentional Defects</text>

  <text x="305" y="165" font-size="36" fill="#ccc" font-weight="300">/</text>

  <rect x="340" y="100" width="200" height="120" rx="8" fill="#e8f5e9" stroke="#27ae60" stroke-width="1.5"/>
  <text x="440" y="175" class="big-number" fill="#27ae60">42</text>
  <text x="440" y="200" class="big-label" fill="#27ae60">Detected</text>

  <text x="565" y="165" font-size="36" fill="#ccc" font-weight="300">=</text>

  <rect x="600" y="100" width="140" height="120" rx="8" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="670" y="170" font-size="48" font-weight="800" fill="#fff" text-anchor="middle">100%</text>
  <text x="670" y="196" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">DETECTION</text>

  <!-- Zero stats -->
  <rect x="150" y="240" width="520" height="50" rx="6" fill="#fafafa" stroke="#ddd" stroke-width="1"/>

  <rect x="170" y="250" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="220" y="270" class="stat-number" fill="#27ae60">0</text>
  <text x="220" y="282" class="stat-label">missed</text>

  <rect x="290" y="250" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="340" y="270" class="stat-number" fill="#27ae60">0</text>
  <text x="340" y="282" class="stat-label">baseline FP</text>

  <rect x="410" y="250" width="100" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="270" class="stat-number" fill="#27ae60">0</text>
  <text x="460" y="282" class="stat-label">flaky tests</text>

  <rect x="530" y="250" width="120" height="30" rx="4" fill="#e8f5e9" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="270" class="stat-number" fill="#27ae60">0</text>
  <text x="590" y="282" class="stat-label">nondeterminism</text>

  <!-- Rule Categories -->
  <line x1="80" y1="310" x2="740" y2="310" class="divider"/>

  <text x="410" y="336" class="label" font-size="13">74 Rules · 9 Semantic Categories</text>

  <!-- Category bars — corrected per rules_registry.py audit -->
  <!-- Syntax -->
  <rect x="100" y="350" width="160" height="16" class="bar-bg"/>
  <rect x="100" y="350" width="160" height="16" class="bar-fill"/>
  <text x="110" y="362" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Syntax</text>
  <text x="270" y="362" class="annotation" text-anchor="start">UPF-001–006 (6)</text>

  <!-- Reference -->
  <rect x="100" y="370" width="200" height="16" class="bar-bg"/>
  <rect x="100" y="370" width="200" height="16" class="bar-fill"/>
  <text x="110" y="382" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Reference Integrity</text>
  <text x="310" y="382" class="annotation" text-anchor="start">UPF-010–016 (7)</text>

  <!-- Supply / Domain -->
  <rect x="100" y="390" width="220" height="16" class="bar-bg"/>
  <rect x="100" y="390" width="220" height="16" class="bar-fill"/>
  <text x="110" y="402" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Supply &amp; Domain</text>
  <text x="330" y="402" class="annotation" text-anchor="start">UPF-020–025, 065 (7)</text>

  <!-- PST -->
  <rect x="100" y="410" width="240" height="16" class="bar-bg"/>
  <rect x="100" y="410" width="240" height="16" class="bar-fill"/>
  <text x="110" y="422" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Power State Table</text>
  <text x="350" y="422" class="annotation" text-anchor="start">UPF-030–039 (10)</text>

  <!-- Isolation -->
  <rect x="100" y="430" width="280" height="16" class="bar-bg"/>
  <rect x="100" y="430" width="280" height="16" class="bar-fill"/>
  <text x="110" y="442" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Isolation</text>
  <text x="390" y="442" class="annotation" text-anchor="start">UPF-040–047 (8)</text>

  <!-- Retention -->
  <rect x="100" y="450" width="200" height="16" class="bar-bg"/>
  <rect x="100" y="450" width="200" height="16" class="bar-fill"/>
  <text x="110" y="462" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Retention</text>
  <text x="310" y="462" class="annotation" text-anchor="start">UPF-050–054 (5)</text>

  <!-- Level Shifting -->
  <rect x="100" y="470" width="220" height="16" class="bar-bg"/>
  <rect x="100" y="470" width="220" height="16" class="bar-fill"/>
  <text x="110" y="482" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Level Shifting</text>
  <text x="330" y="482" class="annotation" text-anchor="start">UPF-060–064 (5)</text>

  <!-- Power Switch -->
  <rect x="100" y="490" width="260" height="16" class="bar-bg"/>
  <rect x="100" y="490" width="260" height="16" class="bar-fill"/>
  <text x="110" y="502" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Power Switch</text>
  <text x="370" y="502" class="annotation" text-anchor="start">UPF-070–079 (10)</text>

  <!-- Design-aware + Hierarchical + Mapping -->
  <rect x="100" y="510" width="280" height="16" class="bar-bg"/>
  <rect x="100" y="510" width="280" height="16" class="bar-fill"/>
  <text x="110" y="522" font-size="9" fill="#fff" text-anchor="start" font-weight="600">Design / Hierarchical / Mapping</text>
  <text x="390" y="522" class="annotation" text-anchor="start">UPF-080–084, 090–100 (16)</text>

  <!-- Footer -->
  <text x="410" y="550" class="label-mono" font-size="9">UPF-Insight v0.2.4 · deterministic · local-first · evidence-backed</text>
</svg>
