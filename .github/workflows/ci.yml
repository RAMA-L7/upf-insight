name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Rule registry audit
        run: upf-insight rules audit
      - name: Quality corpus
        run: upf-insight quality
      - name: Tests
        run: pytest tests/ -q

  engine-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Exit-code contract (clean fixture exits 0)
        run: |
          upf-insight check tests/examples/example.soc.upf > /dev/null
          echo "exit=$?"
      - name: Golden runner
        run: python scripts/run_golden.py

  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Save baseline
        run: |
          pip install -e .
          upf-insight check tests/examples/cpu_subsys/cpu_subsys_v1.upf \
            --save-baseline baseline.json > /dev/null || true
      - name: UPF quality gate
        id: gate
        uses: ./.github/actions/upf-gate
        with:
          upf: tests/examples/cpu_subsys/cpu_subsys_v2.upf
          baseline: baseline.json
          gate: NO_READINESS_REGRESSION
      - name: Gate verdict
        run: echo "gate-result=${{ steps.gate.outputs.gate-result }}"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile all modules
        run: python -m compileall -q upf_insight scripts
      - name: Import smoke
        run: |
          python -c "import upf_insight.cli.cli, upf_insight.api.api_server, upf_insight.api.mcp_server, upf_insight.tools.linter, upf_insight.tools.converter, upf_insight.tools.batch_runner"
